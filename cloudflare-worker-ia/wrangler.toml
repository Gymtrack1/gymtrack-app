# Configuración opcional para desplegar con la CLI de Cloudflare (wrangler) en vez del
# dashboard web. La forma más simple para alguien sin experiencia programando es seguir
# README.md (copiar/pegar worker.js directo en el dashboard) — este archivo es solo para quien
# prefiera la línea de comandos.
#
# Uso (requiere Node.js instalado):
#   npx wrangler login
#   npx wrangler secret put GEMINI_API_KEY   # te pide pegar la key, la guarda como secreto
#   npx wrangler deploy

name = "gymtrack-ia"
main = "worker.js"
compatibility_date = "2026-09-08"
preview_urls = false

# 2026-10-15: igualado a lo que ya estaba configurado en el dashboard de Cloudflare, para que un
# `wrangler deploy` no lo pise. Si cambias algo de esto en el dashboard, cámbialo aquí también.
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

[observability]
enabled = true

[observability.logs]
enabled = true
